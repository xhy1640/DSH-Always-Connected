<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#whaleGrad)" filter="url(#shadow)" />

  <!-- Outer circle glow -->
  <circle cx="64" cy="64" r="44" fill="#ffffff" fill-opacity="0.12" />

  <!-- Whale & Palette Motif -->
  <!-- Cute Whale Body -->
  <path d="M34 76 C34 52 50 42 74 42 C92 42 100 52 100 64 C100 74 90 82 72 82 C56 82 48 84 40 88 C38 89 34 86 34 76 Z" fill="#ffffff" />
  
  <!-- Whale Dorsal Fin / Ahoge -->
  <path d="M60 42 C60 30 68 24 72 24 C72 32 68 38 64 42 Z" fill="#60a5fa" />
  <circle cx="72" cy="24" r="3" fill="#ffffff" />

  <!-- Whale Eye -->
  <circle cx="48" cy="60" r="4" fill="#1e3a8a" />
  <circle cx="49.5" cy="58.5" r="1.5" fill="#ffffff" />

  <!-- Whale Blush -->
  <ellipse cx="44" cy="67" rx="4" ry="2" fill="#f472b6" fill-opacity="0.7" />

  <!-- Maid Headband Frills -->
  <path d="M52 45 Q56 41 60 45 Q64 41 68 45 Q72 41 76 45" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Palette / Magic Wand Sparkles -->
  <path d="M84 48 L94 38 M94 48 L84 38" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <circle cx="89" cy="43" r="2.5" fill="#f59e0b" />

  <!-- Small Magic Stars -->
  <path d="M30 36 L32 30 L34 36 L40 38 L34 40 L32 46 L30 40 L24 38 Z" fill="#fde047" />
  <path d="M96 78 L97.5 74 L99 78 L103 79.5 L99 81 L97.5 85 L96 81 L92 79.5 Z" fill="#fde047" />

  <!-- Chain Link Motif -->
  <g transform="translate(68, 70) scale(0.6)">
    <rect x="0" y="4" width="28" height="14" rx="7" fill="none" stroke="#38bdf8" stroke-width="4" />
    <rect x="18" y="4" width="28" height="14" rx="7" fill="none" stroke="#60a5fa" stroke-width="4" />
  </g>
</svg>